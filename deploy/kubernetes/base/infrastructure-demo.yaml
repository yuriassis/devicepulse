# Demonstration-only stateful dependencies. Production must use managed services or operators.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data, namespace: devicepulse }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: devicepulse }
spec: { replicas: 1, selector: { matchLabels: { app: postgres } }, template: { metadata: { labels: { app: postgres } }, spec: { containers: [{ name: postgres, image: 'postgres:16-alpine', envFrom: [{ secretRef: { name: devicepulse-secrets } }], ports: [{ containerPort: 5432 }], volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }], resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } } }], volumes: [{ name: data, persistentVolumeClaim: { claimName: postgres-data } }] } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: devicepulse }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: devicepulse }
spec: { replicas: 1, selector: { matchLabels: { app: rabbitmq } }, template: { metadata: { labels: { app: rabbitmq } }, spec: { containers: [{ name: rabbitmq, image: 'rabbitmq:3.13-management-alpine', envFrom: [{ secretRef: { name: devicepulse-secrets } }], ports: [{ containerPort: 5672 }], resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } } }] } } }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: devicepulse }
spec: { selector: { app: rabbitmq }, ports: [{ port: 5672 }] }
