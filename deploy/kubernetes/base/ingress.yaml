apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: devicepulse, namespace: devicepulse }
spec: { rules: [{ host: devicepulse.example.com, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 8080 } } } }] } }] }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: devicepulse, namespace: devicepulse }
spec: { to: { kind: Service, name: frontend }, port: { targetPort: 8080 }, tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect } }
