apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: devicepulse }
spec:
  replicas: 1
  selector: { matchLabels: { app: devicepulse-frontend } }
  template:
    metadata: { labels: { app: devicepulse-frontend } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - { name: frontend, image: 'devicepulse/frontend:latest', ports: [{ containerPort: 8080 }], resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }, securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: devicepulse }
spec: { selector: { app: devicepulse-frontend }, ports: [{ port: 8080, targetPort: 8080 }] }
