name: CI

on:
  push:
    branches: [main, work]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore backend/DevicePulse.sln
      - run: dotnet build backend/DevicePulse.sln --configuration Release --no-restore
      - run: dotnet test backend/DevicePulse.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
